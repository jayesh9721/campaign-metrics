name: Deploy

on:
  push:
    branches: [main]

env:
  GCP_REGION: us-central1
  BACKEND_SERVICE: copilot-backend
  FRONTEND_SERVICE: copilot-frontend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --source backend \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars CLOUDSQL_INSTANCE_CONNECTION_NAME=${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }},CLOUDSQL_DB_USER=${{ secrets.CLOUDSQL_DB_USER }},CLOUDSQL_DB_PASSWORD=${{ secrets.CLOUDSQL_DB_PASSWORD }},CLOUDSQL_DB_NAME=${{ secrets.CLOUDSQL_DB_NAME }},META_ACCESS_TOKEN=${{ secrets.META_ACCESS_TOKEN }},META_AD_ACCOUNT_ID=${{ secrets.META_AD_ACCOUNT_ID }},OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }},PIPELINE_TRIGGER_SECRET=${{ secrets.PIPELINE_TRIGGER_SECRET }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --source frontend \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-build-env-vars NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
